# Firebase App Hosting configuration
# Per master-plan-v11 §3.1.2

runConfig:
  # 💰 minInstances: 0 — موقع محتوى B2B (زي موحّد): لا webhook/cron/functions،
  #    فقط نموذج quote متزامن وrevalidate — كلها تتحمّل cold-start. الـ instance
  #    الدائم كان يستهلك أغلب فاتورة $15/شهر؛ مع 0 نُحاسَب على المعالجة فقط.
  minInstances: 0
  maxInstances: 10
  cpu: 1
  memoryMiB: 1024
  concurrency: 80
  # 💰 cpuThrottling عاد للافتراضي (true): كل مسارات الـ API (quote/revalidate/
  #    health/og/ai-feed) متزامنة بالكامل — لا عمل خلفي بعد الرد، فلا حاجة لـ CPU
  #    دائم التخصيص. ⚠️ لو نُفّذ TODO تكامل CRM في api/quote مستقبلاً يجب أن تكون
  #    نداءاته awaited قبل إرسال الرد (fire-and-forget سيتجمّد مع الخنق الافتراضي).

env:
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://uneom.com
  - variable: REVALIDATE_SECRET
    secret: revalidate-secret

cacheConfig:
  ttl: "3600s"
